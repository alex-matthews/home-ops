[env]
FLATE_PATH = "{{config_root}}/kubernetes/flux/cluster"
KUBECONFIG = "{{config_root}}/kubeconfig-readonly"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talosconfig-readonly"
JUST_UNSTABLE = "1"

_.file = ["{{config_root}}/.secrets.env"]

[tools]
actionlint = "1.7.12"
age = "1.3.2"
# Chart-source signature re-validation (ADR-0003); run via `mise exec -- cosign`.
cosign = "3.1.3"
flux2 = "2.9.5"
"github:home-operations/flate" = "v0.6.5"
"github:mitsuhiko/minijinja" = "2.24.0"
gum = "2.0.0"
helm = "4.2.4"
helmfile = "1.7.4"
jq = "1.8.2"
just = "1.58.0"
# Kopiur CLI. Tracks the v1alpha1 CRDs, so keep it on the operator's release;
# bump it with the kopiur chart, not independently. mise exposes it as
# `kopiur`, not `kubectl-kopiur`, so invoke it directly rather than as a
# kubectl plugin.
"github:home-operations/kopiur" = "0.10.7"
# Direct repository access for `just kube retire-backups` (ADR-0005); pinned so
# a run uses a known kopia, never whatever the workstation has.
kopia = "0.23.1"
kubectl = "1.37.0"
kustomize = "5.8.1"
lefthook = "2.1.12"
oxfmt = "0.66.0"
sops = "3.13.3"
talosctl = "1.14.0"
yq = "4.53.6"
zizmor = "1.30.0"

[hooks]
postinstall = "lefthook install"
