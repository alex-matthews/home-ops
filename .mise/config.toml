[env]
FLATE_PATH = "{{config_root}}/kubernetes/flux/cluster"
KUBECONFIG = "{{config_root}}/kubeconfig-readonly"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talosconfig-readonly"
JUST_UNSTABLE = "1"

_.file = ["{{config_root}}/.secrets.env"]

[tools]
actionlint = "1.7.12"
age = "1.3.2"
# Chart-source signature re-validation (docs/policy/decisions.md#chart-trust); run via `mise exec -- cosign`.
cosign = "3.1.4"
# Signature and referrer discovery for the chart signing check (#2018); run via `mise exec -- oras`.
oras = "1.3.6"
flux2 = "2.9.6"
"github:home-operations/flate" = "v0.6.5"
"github:mitsuhiko/minijinja" = "3.0.3"
gum = "2.0.2"
helm = "4.3.1"
helmfile = "1.8.2"
jq = "1.8.2"
just = "1.59.0"
# Kopiur CLI. Tracks the v1alpha1 CRDs, so keep it on the operator's release;
# bump it with the kopiur chart, not independently. mise exposes it as
# `kopiur`, not `kubectl-kopiur`, so invoke it directly rather than as a
# kubectl plugin.
"github:home-operations/kopiur" = "0.10.16"
kubectl = "1.37.1"
kustomize = "5.8.3"
lefthook = "2.2.2"
oxfmt = "0.74.0"
# Lints the bash scripts CI runs (.github/scripts, tests); run via `mise exec -- shellcheck`.
shellcheck = "0.11.0"
sops = "3.13.3"
talosctl = "1.14.5"
yq = "4.54.1"
zizmor = "1.31.1"

[hooks]
postinstall = "lefthook install"
# A sitting starts with a fresh read-only token (#2021). The recipe is a
# no-op while the current token has more than an hour left, and it needs
# the administrative kubeconfig beside it; the `|| true` keeps a shell
# usable when the cluster is unreachable. It also warns once the
# administrative talosconfig or kubeconfig has 30 days or less left, since
# nothing renews them on its own.
enter = [
  "just kube readonly-token || true",
  "just kube cert-reminder || true",
  "just talos cert-reminder || true",
]
