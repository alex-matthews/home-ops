---
# yaml-language-server: $schema=https://kritika.home-operations.com/kritika.schema.json
context:
  - path: .kritika/context.md
    description: >-
      Read first. What is authoritative in this repository, in what order,
      and which documents are being replaced and may be stale.
rules:
  - id: renovate
    whenExpr: pr.headRef.startsWith("renovate/")
    rule: >-
      This is a dependency update. Read the upstream release notes, changelog
      and upgrade notes for every version in the range with gh; the body may
      be cut. Check each entry against what this repository sets for the app:
      its HelmRelease values, OCIRepository, ExternalSecret, routes, storage
      and anything else in its directory. Open the commit range only for an
      entry that fixes security, changes authentication or credentials,
      migrates stored data, changes a protocol something here speaks, or names
      a key the manifests set, or when the notes are missing. For a chart,
      compare templates/, crds/, values.yaml and values.schema.json between
      the two tags rather than trusting the notes. A digest change under an
      unchanged tag is a rebuild. A breaking change nothing here uses is not a
      finding. Report what the update breaks here, a migration or companion
      change it makes due, and a pin or workaround in the app's directory it
      makes unnecessary, each on the changed version line. For a GitHub Action
      or a tool pinned in .mise/, the places to check are the workflows,
      scripts and tasks that use it, not an app directory.
  - id: manifests
    paths: ["kubernetes/**"]
    rule: >-
      Check what this change adds or edits. A new or changed image reference
      carries tag@digest, unless the file already pins that image without one.
      A hostname is ${SECRET_DOMAIN} or an existing variable, never
      a literal public name. A new app has a ks.yaml Flux Kustomization
      pointing at its app/ directory, and a kustomization.yaml there listing
      every file. A dependsOn edge follows this rule: a Kustomization whose
      product is instances of an operator's API depends on the Kustomization
      that ships the operator (and an operator whose CRDs ship in a separate
      CRD chart depends on that chart); everything else gets no edge unless
      it meets the evidence-based exception, which requires demonstrated
      evidence of a stored-release Helm failure with bounded remediation. A
      change to a file ending in .sops.yaml shows only ENC[...] values and
      changes under its sops: block (mac, lastmodified, version); plaintext in
      such a file is a breach. Report each breach on its line; otherwise say
      nothing.
  - id: state
    paths: ["kubernetes/**"]
    rule: >-
      If this change renames or removes an ExternalSecret, its target Secret
      or a template key, a PVC, a storage class, a namespace, or an app name
      that Flux, alerts, dashboards or backups use, or alters Kopiur wiring or
      a backup's schedule, retention or restore wiring, report as a finding
      what breaks or is lost: data, a Secret something still reads, or backup
      coverage. For a renamed name, grep kubernetes/ for every reference left
      behind. Otherwise say nothing.
  - id: exposure
    paths: ["kubernetes/**"]
    rule: >-
      If this change adds a route whose parentRefs name envoy-external, or
      widens what an existing one serves (hostnames, paths, methods), read
      docs/operations/public-surfaces.md at the head with read_file (docs/ is
      left out of the diff). Report as a finding when the surface has no row
      there naming its consumers and the control in front of it. Otherwise say
      nothing.
  - id: window
    paths:
      - "talos/**"
      - "kubernetes/apps/kube-system/cilium/**"
      - "kubernetes/apps/flux-system/flux-instance/**"
      - "kubernetes/apps/system-upgrade/tuppr/upgrades/**"
    rule: >-
      If this change takes effect by restarting Cilium agents, Flux's
      controllers or the Kubernetes API, or by rebooting or upgrading nodes,
      report as a finding what restarts or reboots, and whether it happens on
      merge without anyone present or needs someone to apply it at a
      maintenance window. Otherwise say nothing.
