---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: "${APP}-remote"
spec:
  repository:
    kind: ClusterRepository
    name: remote
  sources:
    - pvc:
        name: "${APP}"
  # Explicit rather than defaulted: the upstream default shifted once already
  # (Direct -> Snapshot) and this field decides whether the app PVC is read
  # live or from a CSI snapshot.
  copyMethod: Snapshot
  volumeSnapshotClassName: "${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}"
  compression:
    compressor: zstd
  # Leaner GFS than local: the independent cadence and retention is the point
  # of ADR-0002's remote shape.
  retention:
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 3
  mover:
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1032}
      runAsGroup: ${KOPIUR_PGID:=100}
    cache:
      capacity: "${KOPIUR_CACHE_CAPACITY:=5Gi}"
      # kopia's default budgets are 5000 MiB each, more than the claim holds;
      # a deep verify of plex filled it. Capped so both fit with room for logs.
      contentCacheSizeMb: 2048
      metadataCacheSizeMb: 1024
      mode: Persistent
      storageClassName: ceph-block
  # Quick tier only, weekly, on the default blob check (no file reads): the
  # cost is the household download, and deep verification of the same data
  # runs against the local repository (#1985).
  verification:
    quick:
      schedule:
        cron: "H 7 * * 0"
        jitter: 1h
    # Quick only: kopia's exit code is the verdict; the manifest-derived file
    # count reported zero for one policy on 2026-09-05 (#1985).
    successExpr: "stats.errors == 0"
