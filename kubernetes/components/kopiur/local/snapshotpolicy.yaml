---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: "${APP}"
spec:
  repository:
    kind: ClusterRepository
    name: local
  sources:
    - pvc:
        name: "${APP}"
  # Explicit rather than defaulted: the upstream default shifted once already
  # (Direct -> Snapshot) and this field decides whether the app PVC is read
  # live or from a CSI snapshot.
  copyMethod: Snapshot
  volumeSnapshotClassName: "${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}"
  compression:
    compressor: zstd
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  mover:
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1032}
      runAsGroup: ${KOPIUR_PGID:=100}
    cache:
      capacity: "${KOPIUR_CACHE_CAPACITY:=5Gi}"
      mode: Persistent
      storageClassName: ceph-block
  # Two tiers, decided in #1985. Quick reads repository blobs and a small
  # share of file content daily; deep restores the latest snapshot into
  # node-ephemeral scratch monthly (no capacity, so an emptyDir). Both land
  # after the H 3 remote snapshot and the H 4 / H 5 full maintenance runs;
  # timezone inherits from the repository.
  verification:
    quick:
      schedule:
        cron: "H 7 * * *"
        jitter: 30m
    deep:
      schedule:
        cron: "H 1 1 * *"
        jitter: 1h
    successExpr: "stats.files > 0 && stats.errors == 0"
    verifyFilesPercent: 5
