---
# The operator stopped managing this policy in v1.7.0. Dragonfly runs without
# a password, so this is what keeps it private to its namespace and its admin
# port to the operator.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${APP}-dragonfly
spec:
  podSelector:
    matchLabels:
      app: ${APP}-dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 6379
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dragonfly-system
          podSelector:
            matchLabels:
              control-plane: controller-manager
        - podSelector:
            matchLabels:
              app: ${APP}-dragonfly
              app.kubernetes.io/name: dragonfly
              app.kubernetes.io/part-of: dragonfly
      ports:
        - port: 9999
          protocol: TCP
