---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: kritika-badges
spec:
  # The badges route's public record; unifi-dns ignores DNSEndpoints.
  endpoints:
    - dnsName: kritika.${SECRET_DOMAIN}
      recordType: CNAME
      targets:
        - external.${SECRET_DOMAIN}
