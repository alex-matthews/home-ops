---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kritika-webhook
  annotations:
    gatus.home-operations.com/endpoint: |-
      conditions: ["[STATUS] == 404"]
spec:
  hostnames:
    - kritika-webhook.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    # Only GitHub's webhook deliveries are public. POST only: kritika serves
    # its dashboard for every other request on this port.
    - backendRefs:
        - name: kritika
          port: 8080
      matches:
        - method: POST
          path:
            type: PathPrefix
            value: /hooks/
