---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: kritika
spec:
  cluster:
    name: kritika-postgres
  name: kritika
  owner: kritika
  databaseReclaimPolicy: retain
  extensions:
    # Renovate moves the vchord pin with its image; move vector's when
    # PostgresExtensionBehindImage fires (the operand image bundles pgvector).
    - name: vector
      ensure: present
      version: "0.8.7"
    - name: vchord
      ensure: present
      version: "1.1.1"
