---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kritika-postgres
spec:
  # Same operand and vchord images as database/postgres, so the
  # cnpg-postgres Renovate group moves both clusters together. pgvector
  # comes from this standard image, not an extension image.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
  # One instance and no backup: kritika's trial history is accepted as
  # losable (docs/policy/decisions.md#kritika-database-exception).
  instances: 1
  # A one-instance PDB would block every drain of m1.
  enablePDB: false
  primaryUpdateMethod: restart
  storage:
    size: 10Gi
    storageClass: openebs-hostpath
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - m1
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: kritika
      owner: kritika
      secret:
        name: kritika-postgres-owner
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: true
  postgresql:
    shared_preload_libraries:
      - vchord.so
    extensions:
      # vchord-scratch uses the base image's install tree, not CNPG's
      # extension-image layout, so its paths must be named.
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1@sha256:bdea43bed2a414e21bbf71767bf6f0739747ac480b267b51772dc214ac28dcb3
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18
