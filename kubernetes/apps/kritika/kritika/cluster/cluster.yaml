---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kritika-postgres
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: kritika-postgres
    major: 18
  # No backup: kritika's history is accepted as losable
  # (docs/policy/decisions.md#kritika-database-exception).
  instances: 2
  primaryUpdateMethod: switchover
  storage:
    size: 10Gi
    storageClass: openebs-hostpath
  affinity:
    podAntiAffinityType: required
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: kritika
      owner: kritika
      secret:
        name: kritika-postgres-owner
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: true
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
    shared_preload_libraries:
      - vchord.so
    extensions:
      - name: vchord
