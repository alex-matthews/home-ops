                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: prometheus
                        spec:
                          editorMode: code
                          expr: >-
                            max(label_replace(max(ceph_health_status) or vector(2),
                            "signal", "ceph", "__name__", ".*") or label_replace((1
                            - min(probe_success{job="nfs_probe"})) or vector(1),
