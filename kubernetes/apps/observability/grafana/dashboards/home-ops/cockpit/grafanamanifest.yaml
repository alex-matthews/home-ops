---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanamanifest_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaManifest
metadata:
  name: home-ops-cockpit
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  template:
    apiVersion: dashboard.grafana.app/v2
    kind: Dashboard
    metadata:
      name: home-ops-cockpit
      annotations:
        grafana.app/folder: home-ops
    spec:
      annotations:
        - kind: AnnotationQuery
          spec:
            query:
              kind: DataQuery
              group: grafana
              version: v0
              datasource:
                name: "-- Grafana --"
              spec:
                limit: 100
                matchAny: false
                tags: []
                type: dashboard
            enable: true
            hide: true
            iconColor: rgba(0, 211, 255, 1)
            name: Annotations & Alerts
            builtIn: true
            legacyOptions:
              type: dashboard
      cursorSync: Crosshair
      editable: true
      elements:
        panel-2:
          kind: Panel
          spec:
            id: 2
            title: Critical
            description: Critical alerts. Shows OK when none are firing.
            links:
              - title: Alertmanager
                url: https://alertmanager.${SECRET_DOMAIN}/#/alerts
                targetBlank: true
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: prometheus
                        spec:
                          editorMode: code
                          expr: >-
                            sum(ALERTS{alertstate="firing",severity="critical",alertname!~"Watchdog|KubeHpaMaxedOut"})
                            or vector(0)
                          instant: true
                          legendFormat: Critical
                          range: false
                      refId: A
                      hidden: false
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: stat
              version: 12.0.1
              spec:
                options:
                  colorMode: value
                  graphMode: none
                  justifyMode: center
                  orientation: auto
                  percentChangeColorMode: standard
                  reduceOptions:
                    calcs:
                      - lastNotNull
                    fields: ""
                    values: false
                  showPercentChange: false
                  textMode: value
                  wideLayout: false
                fieldConfig:
                  defaults:
                    mappings:
                      - type: value
                        options:
                          "0":
                            text: OK
                            color: green
                            index: 0
                    thresholds:
                      mode: absolute
                      steps:
                        - value: null
                          color: green
                        - value: 1
                          color: yellow
                        - value: 1
                          color: red
                    color:
                      mode: thresholds
                    noValue: No data
                  overrides: []
        panel-20:
          kind: Panel
          spec:
            id: 20
            title: Actionable alerts
            description: >-
              Current non-noise firing alerts. Shows an all-clear row when there are
              no matching alerts.
            links:
              - title: Alertmanager
                url: https://alertmanager.${SECRET_DOMAIN}/#/alerts
                targetBlank: true
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: prometheus
                        spec:
                          editorMode: code
                          expr: >-
                            sort_desc((sum by (severity, alertname, namespace)
                            (ALERTS{alertstate="firing",alertname!~"Watchdog|KubeHpaMaxedOut"}))
                            or (label_replace(label_replace(label_replace(vector(0),
                            "severity", "ok", "__name__", ".*"), "alertname", "all
                            clear", "__name__", ".*"), "namespace", "cluster",
                            "__name__", ".*") unless on() (count(sum by (severity,
                            alertname, namespace)
                            (ALERTS{alertstate="firing",alertname!~"Watchdog|KubeHpaMaxedOut"}))
                            > 0)))
                          format: table
                          instant: true
                          legendFormat: __auto
                          range: false
                      refId: A
                      hidden: false
                transformations:
                  - kind: Transformation
                    group: organize
                    spec:
                      options:
                        excludeByName:
                          Time: true
                        indexByName:
                          Value: 3
                          alertname: 1
                          namespace: 2
                          severity: 0
                        renameByName:
                          Value: active
                          alertname: alert
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: table
              version: 12.0.1
              spec:
                options:
                  cellHeight: sm
                  footer:
                    countRows: false
                    fields: ""
                    reducer:
                      - sum
                    show: false
                  showHeader: true
                  sortBy:
                    - desc: true
                      displayName: active
                fieldConfig:
                  defaults:
                    thresholds:
                      mode: absolute
                      steps:
                        - value: null
                          color: green
                    custom:
                      align: auto
                      cellOptions:
                        type: auto
                      filterable: true
                      inspect: false
                  overrides: []
        panel-3:
          kind: Panel
          spec:
            id: 3
            title: Warnings
            description: Warning alerts. Shows OK when none are firing.
            links:
              - title: Alertmanager
                url: https://alertmanager.${SECRET_DOMAIN}/#/alerts
                targetBlank: true
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: prometheus
                        spec:
                          editorMode: code
                          expr: >-
                            sum(ALERTS{alertstate="firing",severity="warning",alertname!~"Watchdog|KubeHpaMaxedOut"})
                            or vector(0)
                          instant: true
                          legendFormat: Warnings
                          range: false
                      refId: A
                      hidden: false
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: stat
              version: 12.0.1
              spec:
                options:
                  colorMode: value
                  graphMode: none
                  justifyMode: center
                  orientation: auto
                  percentChangeColorMode: standard
                  reduceOptions:
                    calcs:
                      - lastNotNull
                    fields: ""
                    values: false
                  showPercentChange: false
                  textMode: value
                  wideLayout: false
                fieldConfig:
                  defaults:
                    mappings:
                      - type: value
                        options:
                          "0":
                            text: OK
                            color: green
                            index: 0
                    thresholds:
                      mode: absolute
                      steps:
                        - value: null
                          color: green
                        - value: 1
                          color: yellow
                        - value: 5
                          color: red
                    color:
                      mode: thresholds
                    noValue: No data
                  overrides: []
        panel-4:
          kind: Panel
          spec:
            id: 4
            title: GitOps apps
            description: >-
              Flux Kustomizations and HelmReleases that are not Ready or are
              suspended. Shows OK when none need attention.
            links:
              - title: Flux dashboards
                url: https://grafana.${SECRET_DOMAIN}/dashboards?query=flux
                targetBlank: true
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: prometheus
                        spec:
                          editorMode: code
                          expr: >-
                            count((gotk_resource_info{customresource_kind=~"Kustomization|HelmRelease",ready!="True"}
                            == 1) or
                            (gotk_resource_info{customresource_kind=~"Kustomization|HelmRelease",suspended=~"True|true"}
                            == 1)) or vector(0)
                          instant: true
                          legendFormat: GitOps apps
                          range: false
                      refId: A
                      hidden: false
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: stat
              version: 12.0.1
              spec:
                options:
                  colorMode: value
                  graphMode: none
                  justifyMode: center
                  orientation: auto
                  percentChangeColorMode: standard
                  reduceOptions:
                    calcs:
                      - lastNotNull
                    fields: ""
                    values: false
                  showPercentChange: false
                  textMode: value
                  wideLayout: false
                fieldConfig:
                  defaults:
                    mappings:
                      - type: value
                        options:
                          "0":
                            text: OK
                            color: green
                            index: 0
                    thresholds:
                      mode: absolute
                      steps:
                        - value: null
                          color: green
                        - value: 1
                          color: yellow
                        - value: 3
                          color: red
                    color:
                      mode: thresholds
                    noValue: No data
                  overrides: []
        panel-40:
          kind: Panel
          spec:
            id: 40
            title: Ceph capacity
            description: Ceph raw capacity used over the selected time range.
            links:
              - title: Ceph dashboards
                url: https://grafana.${SECRET_DOMAIN}/dashboards?query=ceph
                targetBlank: true
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: prometheus
                        spec:
                          editorMode: code
                          expr: >-
                            100 * (sum(ceph_cluster_total_used_bytes) /
                            sum(ceph_cluster_total_bytes))
                          instant: false
                          legendFormat: used
                          range: true
                      refId: A
                      hidden: false
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: timeseries
              version: 12.0.1
              spec:
                options:
                  legend:
                    calcs:
                      - lastNotNull
                    displayMode: table
                    placement: bottom
                    showLegend: true
                  tooltip:
                    hideZeros: false
                    mode: multi
                    sort: none
                fieldConfig:
                  defaults:
                    unit: percent
                    decimals: 1
                    thresholds:
                      mode: absolute
                      steps:
                        - value: null
                          color: green
                    custom:
                      drawStyle: line
                      fillOpacity: 8
                      gradientMode: opacity
                      lineInterpolation: smooth
                      lineWidth: 1
                      pointSize: 4
                      showPoints: never
                      spanNulls: false
                  overrides: []
        panel-41:
          kind: Panel
          spec:
            id: 41
            title: PVC free floor
            description: Persistent volumes with the least free space.
            links: []
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: prometheus
                        spec:
                          editorMode: code
                          expr: >-
                            bottomk(10, (kubelet_volume_stats_available_bytes /
                            kubelet_volume_stats_capacity_bytes) * 100)
                          format: table
                          instant: true
                          legendFormat: __auto
                          range: false
                      refId: A
                      hidden: false
                transformations:
                  - kind: Transformation
                    group: organize
                    spec:
                      options:
                        excludeByName:
                          Time: true
                          endpoint: true
                          instance: true
                          job: true
                          metrics_path: true
                          service: true
                        indexByName:
                          Value: 3
                          namespace: 0
                          node: 2
                          persistentvolumeclaim: 1
                        renameByName:
                          Value: free
                          persistentvolumeclaim: pvc
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: table
              version: 12.0.1
              spec:
                options:
                  cellHeight: sm
                  footer:
                    countRows: false
                    fields: ""
                    reducer:
                      - sum
                    show: false
                  showHeader: true
                  sortBy:
                    - desc: false
                      displayName: free
                fieldConfig:
                  defaults:
                    unit: percent
                    decimals: 1
                    thresholds:
                      mode: absolute
                      steps:
                        - value: null
                          color: green
                    custom:
                      align: auto
                      cellOptions:
                        type: auto
                      filterable: true
                      inspect: false
                  overrides: []
        panel-42:
          kind: Panel
          spec:
            id: 42
            title: Cluster saturation
            description: >-
              Cluster CPU and memory usage as a percentage of Kubernetes allocatable
              capacity.
            links: []
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: prometheus
                        spec:
                          editorMode: code
                          expr: >-
                            100 *
                            sum(rate(container_cpu_usage_seconds_total{container!="",image!=""}[5m]))
                            /
                            sum(kube_node_status_allocatable{resource="cpu",unit="core"})
                          instant: false
                          legendFormat: cpu allocatable used
                          range: true
                      refId: A
                      hidden: false
                  - kind: PanelQuery
                    spec:
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: prometheus
                        spec:
                          editorMode: code
                          expr: >-
                            100 *
                            sum(container_memory_working_set_bytes{container!="",image!=""})
                            /
                            sum(kube_node_status_allocatable{resource="memory",unit="byte"})
                          instant: false
                          legendFormat: memory allocatable used
                          range: true
                      refId: B
                      hidden: false
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: timeseries
              version: 12.0.1
              spec:
                options:
                  legend:
                    calcs:
                      - lastNotNull
                    displayMode: table
                    placement: bottom
                    showLegend: true
                  tooltip:
                    hideZeros: false
                    mode: multi
                    sort: none
                fieldConfig:
                  defaults:
                    unit: percent
                    decimals: 1
                    thresholds:
                      mode: absolute
                      steps:
                        - value: null
                          color: green
                    custom:
                      drawStyle: line
                      fillOpacity: 8
                      gradientMode: opacity
                      lineInterpolation: smooth
                      lineWidth: 1
                      pointSize: 4
                      showPoints: never
                      spanNulls: false
                  overrides: []
        panel-5:
          kind: Panel
          spec:
            id: 5
            title: Services
            description: >-
              External and service Gatus checks currently failing. Shows OK when all
              are passing.
            links:
              - title: Status
                url: https://status.${SECRET_DOMAIN}
                targetBlank: true
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: prometheus
                        spec:
                          editorMode: code
                          expr: >-
                            count(gatus_results_endpoint_success{group=~"external|services"}
                            == 0) or vector(0)
                          instant: true
                          legendFormat: Services down
                          range: false
                      refId: A
                      hidden: false
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: stat
              version: 12.0.1
              spec:
                options:
                  colorMode: value
                  graphMode: none
                  justifyMode: center
                  orientation: auto
                  percentChangeColorMode: standard
                  reduceOptions:
                    calcs:
                      - lastNotNull
                    fields: ""
                    values: false
                  showPercentChange: false
                  textMode: value
                  wideLayout: false
                fieldConfig:
                  defaults:
                    mappings:
                      - type: value
                        options:
                          "0":
                            text: OK
                            color: green
                            index: 0
                    thresholds:
                      mode: absolute
                      steps:
                        - value: null
                          color: green
                        - value: 1
                          color: yellow
                        - value: 3
                          color: red
                    color:
                      mode: thresholds
                    noValue: No data
                  overrides: []
        panel-50:
          kind: Panel
          spec:
            id: 50
            title: GitOps sources
            description: Flux source and chart artifacts that are not Ready or are suspended.
            links:
              - title: Flux dashboards
                url: https://grafana.${SECRET_DOMAIN}/dashboards?query=flux
                targetBlank: true
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: prometheus
                        spec:
                          editorMode: code
                          expr: >-
                            count(label_replace(label_replace(label_replace(label_replace(label_replace(((gotk_resource_info{customresource_kind=~"GitRepository|Bucket|HelmRepository|HelmChart|OCIRepository",ready!="True"}
                            == 1) or
                            (gotk_resource_info{customresource_kind=~"GitRepository|Bucket|HelmRepository|HelmChart|OCIRepository",suspended=~"True|true"}
                            == 1)), "namespace", "$1", "exported_namespace",
                            "(.*)"), "resource", "$1", "name", "(.*)"), "detail",
                            "$1", "customresource_kind", "(.*)"), "signal", "source
                            not ready/suspended", "resource", ".*"), "area",
                            "sources", "resource", ".*")) or vector(0)
                          instant: true
                          legendFormat: GitOps sources
                          range: false
                      refId: A
                      hidden: false
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: stat
              version: 12.0.1
              spec:
                options:
                  colorMode: value
                  graphMode: none
                  justifyMode: center
                  orientation: auto
                  percentChangeColorMode: standard
                  reduceOptions:
                    calcs:
                      - lastNotNull
                    fields: ""
                    values: false
                  showPercentChange: false
                  textMode: value
                  wideLayout: false
                fieldConfig:
                  defaults:
                    decimals: 0
                    mappings:
                      - type: value
                        options:
                          "0":
                            text: OK
                            color: green
                            index: 0
                    thresholds:
                      mode: absolute
                      steps:
                        - value: null
                          color: green
                        - value: 1
                          color: yellow
                        - value: 3
                          color: red
                    color:
                      mode: thresholds
                    noValue: No data
                  overrides: []
        panel-51:
          kind: Panel
          spec:
            id: 51
            title: Pods
            description: >-
              Pods with recent restarts, OOM kills, Pending state, or container
              waiting errors. Counts all affected pods or containers; the detail
              table limits restart offenders.
            links:
              - title: Kubernetes dashboards
                url: https://grafana.${SECRET_DOMAIN}/dashboards?query=kubernetes
                targetBlank: true
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: prometheus
                        spec:
                          editorMode: code
                          expr: >-
                            count((label_replace(label_replace(label_replace(label_replace(sum
                            by (namespace, pod, container)
                            (increase(kube_pod_container_status_restarts_total[6h]))
                            > 0, "resource", "$1", "pod", "(.*)"), "detail", "$1",
                            "container", "(.*)"), "signal", "restarts 6h",
                            "resource", ".*"), "area", "pods", "resource", ".*") or
                            label_replace(label_replace(label_replace(label_replace(max
                            by (namespace, pod, container, reason)
                            (kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError"}
                            == 1), "signal", "$1", "reason", "(.*)"), "resource",
                            "$1", "pod", "(.*)"), "detail", "$1", "container",
                            "(.*)"), "area", "pods", "resource", ".*") or
                            label_replace(label_replace(label_replace(label_replace(max
                            by (namespace, pod)
                            (kube_pod_status_phase{phase="Pending"} == 1),
                            "resource", "$1", "pod", "(.*)"), "detail", "",
                            "resource", ".*"), "signal", "pod pending", "resource",
                            ".*"), "area", "pods", "resource", ".*") or
                            label_replace(label_replace(label_replace(label_replace((sum
                            by (namespace, pod, container)
                            (increase(kube_pod_container_status_restarts_total[6h]))
                            > 0) * on(namespace, pod, container) group_left(reason)
                            max by (namespace, pod, container, reason)
                            (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}
                            == 1), "resource", "$1", "pod", "(.*)"), "detail", "$1",
                            "container", "(.*)"), "signal", "OOMKilled 6h",
                            "resource", ".*"), "area", "pods", "resource", ".*")))
                            or vector(0)
                          instant: true
                          legendFormat: Pods
                          range: false
                      refId: A
                      hidden: false
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: stat
              version: 12.0.1
              spec:
                options:
                  colorMode: value
                  graphMode: none
                  justifyMode: center
                  orientation: auto
                  percentChangeColorMode: standard
                  reduceOptions:
                    calcs:
                      - lastNotNull
                    fields: ""
                    values: false
                  showPercentChange: false
                  textMode: value
                  wideLayout: false
                fieldConfig:
                  defaults:
                    decimals: 0
                    mappings:
                      - type: value
                        options:
                          "0":
                            text: OK
                            color: green
                            index: 0
                    thresholds:
                      mode: absolute
                      steps:
                        - value: null
                          color: green
                        - value: 1
                          color: yellow
                        - value: 3
                          color: red
                    color:
                      mode: thresholds
                    noValue: No data
                  overrides: []
        panel-52:
          kind: Panel
          spec:
            id: 52
            title: Workloads
            description: Deployments, StatefulSets, and DaemonSets with unavailable replicas.
            links:
              - title: Kubernetes dashboards
                url: https://grafana.${SECRET_DOMAIN}/dashboards?query=kubernetes
                targetBlank: true
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: prometheus
                        spec:
                          editorMode: code
                          expr: >-
                            count((label_replace(label_replace(label_replace(label_replace((kube_deployment_status_replicas_unavailable
                            > 0), "resource", "$1", "deployment", "(.*)"), "detail",
                            "Deployment", "namespace", ".*"), "signal",
                            "unavailable", "namespace", ".*"), "area", "workloads",
                            "namespace", ".*") or
                            label_replace(label_replace(label_replace(label_replace(((kube_statefulset_status_replicas
                            - kube_statefulset_status_replicas_ready) > 0),
                            "resource", "$1", "statefulset", "(.*)"), "detail",
                            "StatefulSet", "namespace", ".*"), "signal",
                            "unavailable", "namespace", ".*"), "area", "workloads",
                            "namespace", ".*") or
                            label_replace(label_replace(label_replace(label_replace((kube_daemonset_status_number_unavailable
                            > 0), "resource", "$1", "daemonset", "(.*)"), "detail",
                            "DaemonSet", "namespace", ".*"), "signal",
                            "unavailable", "namespace", ".*"), "area", "workloads",
                            "namespace", ".*"))) or vector(0)
                          instant: true
                          legendFormat: Workloads
                          range: false
                      refId: A
                      hidden: false
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: stat
              version: 12.0.1
              spec:
                options:
                  colorMode: value
                  graphMode: none
                  justifyMode: center
                  orientation: auto
                  percentChangeColorMode: standard
                  reduceOptions:
                    calcs:
                      - lastNotNull
                    fields: ""
                    values: false
                  showPercentChange: false
                  textMode: value
                  wideLayout: false
                fieldConfig:
                  defaults:
                    decimals: 0
                    mappings:
                      - type: value
                        options:
                          "0":
                            text: OK
                            color: green
                            index: 0
                    thresholds:
                      mode: absolute
                      steps:
                        - value: null
                          color: green
                        - value: 1
                          color: yellow
                        - value: 3
                          color: red
                    color:
                      mode: thresholds
                    noValue: No data
                  overrides: []
        panel-53:
          kind: Panel
          spec:
            id: 53
            title: Nodes
            description: >-
              Node readiness, pressure, network-unavailable, and unschedulable
              signals.
            links:
              - title: Node dashboards
                url: https://grafana.${SECRET_DOMAIN}/dashboards?query=node
                targetBlank: true
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: prometheus
                        spec:
