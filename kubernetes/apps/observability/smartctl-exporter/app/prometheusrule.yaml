---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smartctl-exporter
spec:
  groups:
    - name: smartctl-exporter.rules
      rules:
        # SATA drives report no percentage_used. Samsung documents attribute
        # 177's normalised value as the percentage of rated P/E cycles left,
        # so 100 minus it puts both kinds of drive on the same scale.
        - record: smartctl:endurance_used:percent
          expr: |-
            max by (node, device) (
              smartctl_device_percentage_used
              or (100 - smartctl_device_attribute{attribute_name="Wear_Leveling_Count", attribute_value_type="value"})
            )

        - alert: SmartDeviceHighTemperature
          expr: |-
            smartctl_device_temperature{temperature_type="current"} > 65
          for: 5m
          annotations:
            summary: >-
              Drive {{ $labels.device }} on {{ $labels.node }} has exceeded 65°C
          labels:
            severity: critical

        - alert: SmartDeviceTestFailed
          expr: |-
            (smartctl_device_smart_status == 0 or smartctl_device_status == 0)
          for: 5m
          annotations:
            summary: >-
              SMART test failed for drive {{ $labels.device }} on {{ $labels.node }}
          labels:
            severity: critical

        - alert: SmartDeviceCriticalWarning
          expr: |-
            smartctl_device_critical_warning != 0
          for: 5m
          annotations:
            summary: >-
              Drive {{ $labels.device }} on {{ $labels.node }} has a SMART critical warning
          labels:
            severity: critical

        # Fires for a day when an error counter rises or the spare falls, so a
        # drive kept in service after an event does not stay firing.
        - alert: SmartDeviceDegrading
          expr: |-
            max by (node, device, attribute_name) (
              label_replace(smartctl_device_media_errors, "attribute_name", "media_errors", "", "")
              or smartctl_device_attribute{attribute_value_type="raw", attribute_name=~"Reallocated_Sector_Ct|Runtime_Bad_Block|Program_Fail_Cnt_Total|Erase_Fail_Count_Total|Uncorrectable_Error_Cnt|CRC_Error_Count"}
            )
            > max by (node, device, attribute_name) (
              label_replace(smartctl_device_media_errors offset 1d, "attribute_name", "media_errors", "", "")
              or smartctl_device_attribute{attribute_value_type="raw", attribute_name=~"Reallocated_Sector_Ct|Runtime_Bad_Block|Program_Fail_Cnt_Total|Erase_Fail_Count_Total|Uncorrectable_Error_Cnt|CRC_Error_Count"} offset 1d
            )
            or
            label_replace(max by (node, device) (smartctl_device_available_spare), "attribute_name", "available_spare", "", "")
            < label_replace(max by (node, device) (smartctl_device_available_spare offset 1d), "attribute_name", "available_spare", "", "")
          annotations:
            summary: >-
              Drive {{ $labels.device }} on {{ $labels.node }}: {{ $labels.attribute_name }} changed for the worse in the last day
          labels:
            severity: critical

        # Fires for a day on each 5-point step from 90, not continuously, so a
        # worn drive awaiting replacement does not stay firing.
        - alert: SmartDeviceEnduranceCrossed
          expr: |-
            smartctl:endurance_used:percent >= 90
            and floor(smartctl:endurance_used:percent / 5) > floor(smartctl:endurance_used:percent offset 1d / 5)
          annotations:
            summary: >-
              Drive {{ $labels.device }} on {{ $labels.node }} has used {{ $value }}% of its rated endurance
          labels:
            severity: warning

        - alert: SmartDeviceInterfaceSlow
          expr: |-
            smartctl_device_interface_speed{speed_type="current"} < (smartctl_device_interface_speed{speed_type="max"} * 0.9)
          for: 5m
          annotations:
            summary: >-
              Drive {{ $labels.device }} on {{ $labels.node }} has a slower interface speed than expected
          labels:
            severity: critical
