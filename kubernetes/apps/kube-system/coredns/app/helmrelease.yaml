---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  chartRef:
    kind: OCIRepository
    name: coredns
  interval: 1h
  values:
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
      # Chart 1.47.1 still ships appVersion 1.14.6, which carries the autopath
      # regression from coredns/coredns#8390 (1.14.3 to 1.14.6: background
      # cache refresh lost the client address, so search-expanded A answers
      # went NXDOMAIN while AAAA stayed fresh). 1.14.7 moves autopath before
      # cache and closes it. Drop this pin once the chart's appVersion is
      # 1.14.7 or later.
      tag: 1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
    replicaCount: 2
    k8sAppLabelOverride: kube-dns
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: 10.96.0.10
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          # The cluster is SingleStack/IPv4, so an AAAA answer is unusable even
          # when upstream returns one. Answer AAAA locally with NODATA instead
          # of forwarding it. Plugin order comes from plugin.cfg, not this
          # list: template(62) runs before kubernetes(69) and forward(75), so
          # AAAA never leaves the cluster.
          #
          # This is a `.`-wide blackhole with no fallthrough and it fails
          # silently as NODATA, not as an error. Remove it before introducing
          # IPv6 or reaching any IPv6-only external host.
          #
          # Something now depends on this: thelounge dropped its
          # --no-network-family-autoselection workaround because this makes the
          # dual-stack race it guarded impossible. Restore that env var in the
          # same change that lifts this blackhole, or its IRC connections start
          # stalling on unroutable AAAA answers again.
          - name: template
            parameters: ANY AAAA
            configBlock: |-
              authority "{{ .Zone }} 60 IN SOA ns.dns.cluster.local. hostmaster.cluster.local. (1 60 60 60 60)"
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          - name: autopath
            parameters: "@kubernetes"
          - name: forward
            parameters: . /etc/resolv.conf
          # servfail 0: upstream failures here are intermittent and the same
          # names resolve on retry, so replaying a cached SERVFAIL for 5s only
          # widens the blast radius.
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
              servfail 0
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
    # Cluster DNS should not be evicted ahead of ordinary workloads under node
    # memory pressure.
    priorityClassName: system-cluster-critical
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
