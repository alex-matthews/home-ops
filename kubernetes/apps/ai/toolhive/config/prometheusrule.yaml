---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: toolhive
spec:
  groups:
    - name: toolhive.rules
      rules:
        # The phase turns Degraded whenever a backend fails its health
        # check; 15 minutes rides out a rollout's restart.
        - alert: VirtualMCPServerNotReady
          expr: |-
            toolhive_resource_info{customresource_kind="VirtualMCPServer", ready!="True"} == 1
          for: 15m
          annotations:
            summary: >-
              VirtualMCPServer {{ $labels.exported_namespace }}/{{ $labels.name }}
              is not ready (phase {{ $labels.phase }}); tools may be missing
          labels:
            severity: warning

        - alert: VirtualMCPServerAbsent
          expr: |-
            absent(toolhive_resource_info{customresource_kind="VirtualMCPServer"})
          for: 5m
          annotations:
            summary: >-
              VirtualMCPServer metric is absent
          labels:
            severity: warning
