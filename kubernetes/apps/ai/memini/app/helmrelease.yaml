---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memini
spec:
  chartRef:
    kind: OCIRepository
    name: memini
  interval: 1h
  values:
    controllers:
      main:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            env:
              MEMINI_API_KEYS_FILE: /etc/memini/api-keys.yaml
              MEMINI_BACKEND: postgres
              MEMINI_EMBED_BASE_URL: http://text-embeddings-inference.ai.svc.cluster.local:8080/v1
              MEMINI_EMBED_MODEL: BAAI/bge-small-en-v1.5
              MEMINI_EMBED_DIMS: "384"
              MEMINI_EMBED_QUERY_PREFIX: "Represent this sentence for searching relevant passages: "
              MEMINI_LLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              MEMINI_LLM_MODEL: openrouter/gpt-6.1-sol
              MEMINI_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-litellm-key
                    key: key
                    # Same key and reason as MEMINI_RERANK_API_KEY below.
                    optional: true
              # Locks the client defaults; the UI cannot change them.
              MEMINI_CLIENT_DEFAULTS: '{"capture_turns":true,"inline_extract":false,"auto_save":true,"session_digest":false}'
              # Keep captured history separate from explicitly authored lessons.
              MEMINI_DISTILL_ON_WRITE: "false"
              # With an LLM configured these two rewrite stored memories:
              # consolidation merges or supersedes them on write, the
              # assessment sweep scores them. Both stay off, so the LLM only
              # answers questions and rewrites queries.
              MEMINI_CONSOLIDATE_MODE: "off"
              MEMINI_ASSESS_INTERVAL: "0s"
              MEMINI_PROMOTE_INTERVAL: "0s"
              MEMINI_RERANK: http://litellm.ai.svc.cluster.local:4000
              MEMINI_RERANK_MODEL: tei/gte-reranker-modernbert-base
              MEMINI_RERANK_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-litellm-key
                    key: key
                    # The operator mints this key after the proxy is ready.
                    # Without it memini still starts, and recall keeps the
                    # composite order until the next restart picks it up.
                    optional: true
              MEMINI_RERANK_POOL: "20"
              # Twenty documents at the 2,048-character cap in one request;
              # the default splits them into serial requests.
              MEMINI_RERANK_MAX_BATCH_CHARS: "48000"
              MEMINI_RERANK_MAX_CONCURRENCY: "1"
              # Below the clients' 30 s budget. No score floor, so a timeout
              # falls back to the composite order instead of an empty result.
              MEMINI_RERANK_TIMEOUT: 20s
              # Per-prompt hook recalls skip the CPU reranker; explicit recalls
              # use it.
              MEMINI_RERANK_PROMPT: "false"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    persistence:
      data:
        enabled: false
      api-keys:
        enabled: true
    serviceMonitor:
      main:
        enabled: true
    route:
      main:
        enabled: true
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
      ui:
        enabled: true
        hostnames:
          - "{{ .Release.Name }}-ui.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
