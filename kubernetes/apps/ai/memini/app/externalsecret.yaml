---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: memini-api-keys
    template:
      data:
        api-keys.yaml: |
          keys:
            - name: alex
              secret: "{{ .ADMIN_KEY }}"
              home: personal/alex
              admin: true
            - name: claude
              secret: "{{ .CLAUDE_KEY }}"
              home: personal/alex
            - name: codex
              secret: "{{ .CODEX_KEY }}"
              home: personal/alex
  dataFrom:
    - extract:
        key: memini
