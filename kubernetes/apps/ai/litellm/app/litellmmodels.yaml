# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: tei-gte-reranker-modernbert-base
spec:
  modelName: tei/gte-reranker-modernbert-base
  # The huggingface provider translates memini's Cohere-style rerank request
  # into TEI's /rerank shape, which memini cannot call directly.
  params:
    model: huggingface/Alibaba-NLP/gte-reranker-modernbert-base
    apiBase: http://tei-reranker.ai.svc.cluster.local:8080
  # LiteLLM skips a key's budget only for a model with both costs set to zero,
  # so a spent memini budget does not also refuse reranking.
  info:
    mode: rerank
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
