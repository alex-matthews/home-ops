---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm-proxy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/instance: litellm
      app.kubernetes.io/managed-by: litellm-operator
  endpoints:
    - interval: 30s
      path: /metrics/
      port: http
      scrapeTimeout: 10s
