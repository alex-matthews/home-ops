---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: kritika
spec:
  proxyRef: litellm
  keyAlias: kritika
  secretName: kritika-litellm-key
  models:
    - openrouter/gpt-6.1-sol
    - openrouter/voyage-code-4
  # NZ$20 in USD at the ECB reference rate of 2026-10-02. The alert in
  # prometheusrule.yaml warns at half of it.
  maxBudget: "11.22"
  budgetDuration: 7d
  maxParallelRequests: 4
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: memini
spec:
  proxyRef: litellm
  keyAlias: memini
  secretName: memini-litellm-key
  models:
    - openrouter/gpt-6.1-sol
    - tei/gte-reranker-modernbert-base
  # NZ$10 in USD at the ECB reference rate of 2026-10-02. The alert in
  # prometheusrule.yaml warns at half of it.
  maxBudget: "5.61"
  budgetDuration: 7d
