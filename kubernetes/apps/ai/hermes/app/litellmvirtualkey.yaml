---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: hermes
spec:
  proxyRef: litellm
  keyAlias: hermes
  secretName: hermes-litellm-key
  secretKey: LITELLM_API_KEY
  # The plan models cost nothing here, so the key carries no budget. Their
  # allowance is shared with kritika's primary review route, so a runaway loop
  # is capped by rate instead.
  models:
    - chatgpt/gpt-6-luna
    - chatgpt/gpt-6-sol
    - chatgpt/gpt-6.1-sol
    - chatgpt/gpt-6-astra
  rpmLimit: 30
