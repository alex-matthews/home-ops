---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  annotations:
    # A recreated cluster recovers from, then archives into, the same
    # prefix; the operator's empty-archive check would refuse the second.
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: postgres
    major: 18
  instances: 2
  primaryUpdateMethod: switchover
  storage:
    size: 20Gi
    storageClass: openebs-hostpath
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - m2
                  - m3
  enableSuperuserAccess: true
  # Governs how new instances bootstrap; existing data is never
  # reinitialised. A recreated cluster, as after a rebuild, restores the
  # archive instead of starting empty, and an empty archive blocks the
  # recovery. Only a genuinely empty archive needs initdb here, once.
  bootstrap:
    recovery:
      source: origin
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: r2
          serverName: postgres-v1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: r2
        # Archive prefix; a second live cluster must never share it.
        serverName: postgres-v1
  postgresql:
    shared_preload_libraries:
      - vchord.so
    extensions:
      - name: vchord
