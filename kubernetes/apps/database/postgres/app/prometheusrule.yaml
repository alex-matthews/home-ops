---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgres
spec:
  groups:
    - name: postgres.rules
      rules:
        # The daily base backup at 00:00Z takes under a minute, so its age peaks
        # just under 24h; 25h is one missed run. Zero means no backup yet.
        - alert: PostgresBackupTooOld
          expr: |-
            time() - max by (namespace, job) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) > 25 * 3600
          for: 5m
          annotations:
            summary: "{{ $labels.job }} has no base backup from the last 25 hours"
          labels:
            severity: warning
        - alert: PostgresBackupFailing
          expr: |-
            max by (namespace, job) (barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp)
              > max by (namespace, job) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
          for: 5m
          annotations:
            summary: "The latest base backup of {{ $labels.job }} failed"
          labels:
            severity: warning
        - alert: PostgresBackupMetricsAbsent
          expr: |-
            absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{job="database/postgres"})
          for: 1h
          annotations:
            summary: "Backup age for database/postgres is unknown: no instance reports it"
          labels:
            severity: warning
        - alert: PostgresArchivingFailing
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 5m
          annotations:
            summary: "WAL archiving is failing on {{ $labels.pod }}"
          labels:
            severity: warning
        - alert: PostgresReplicaNotReplicating
          expr: |-
            cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
          for: 5m
          annotations:
            summary: "Replica {{ $labels.pod }} is not receiving WAL from the primary"
          labels:
            severity: warning
        - alert: PostgresReplicationLag
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 5m
          annotations:
            summary: "Replica {{ $labels.pod }} is over 5 minutes behind the primary"
          labels:
            severity: warning
        - alert: PostgresExtensionBehindImage
          expr: |-
            max by (namespace, datname, extname) (cnpg_pg_extensions_update_available) > 0
          for: 1h
          annotations:
            summary: "Extension {{ $labels.extname }} in {{ $labels.namespace }}/{{ $labels.datname }} trails its image; move its Database version pin"
          labels:
            severity: warning
        - alert: PostgresDown
          expr: |-
            cnpg_collector_up == 0
          for: 5m
          annotations:
            summary: "PostgreSQL is down on {{ $labels.pod }}"
          labels:
            severity: critical
