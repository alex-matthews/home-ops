---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgres
spec:
  groups:
    - name: postgres.rules
      rules:
        # No base-backup age alert: the collector's backup timestamps are deprecated.
        - alert: PostgresArchivingFailing
          annotations:
            summary: "WAL archiving is failing on {{ $labels.pod }}"
          expr: (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 5m
          labels:
            severity: warning
        - alert: PostgresReplicaNotReplicating
          annotations:
            summary: "Replica {{ $labels.pod }} is not receiving WAL from the primary"
          expr: cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
          for: 5m
          labels:
            severity: warning
        - alert: PostgresReplicationLag
          annotations:
            summary: "Replica {{ $labels.pod }} is over 5 minutes behind the primary"
          expr: cnpg_pg_replication_lag > 300
          for: 5m
          labels:
            severity: warning
        - alert: PostgresDown
          annotations:
            summary: "PostgreSQL is down on {{ $labels.pod }}"
          expr: cnpg_collector_up == 0
          for: 5m
          labels:
            severity: critical
