---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: local
spec:
  # Production local backend per ADR-0002: Garage S3 on the NAS, so backup IO
  # never traverses nfsd (the nfs_probe/zeroscaler guardrail path).
  # kopiur-system must be allowed: the managed Maintenance CR lands in the
  # operator namespace, and the allowlist gates it too.
  allowedNamespaces:
    list:
      - default
      - kopiur-system
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-local-secret
          namespace: kopiur-system
      bucket: kopiur
      endpoint: garage.internal:3900
      region: garage
      tls:
        disableTls: true
  create:
    enabled: true
  # Re-scan daily so rows whose snapshot was deleted repository-side expire
  # on their own; a retired app's cleanup leaves no policy to request a scan
  # (ADR-0005). Each scan is one short-lived bootstrap Job.
  catalog:
    periodicRefresh: true
    refreshInterval: 24h
  deletionProtection:
    threshold: 10
  encryption:
    passwordSecretRef:
      name: kopiur-local-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  maintenance:
    schedule:
      # Both blocks are required once schedule is set; quick reproduces the
      # operator default, full moves out of the H 3 remote-snapshot window.
      quick:
        cron: "0 */6 * * *"
        jitter: 30m
      full:
        cron: "H 4 * * *"
  parameters:
    epoch:
      minDuration: 6h
  # Finished mover Jobs and their pods self-delete after 15 minutes instead
  # of the one-hour default; VictoriaLogs keeps the mover logs.
  moverDefaults:
    ttlSecondsAfterFinished: 900
  scheduleDefaults:
    timezone: Pacific/Auckland
