---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: unifi-dns
spec:
  groups:
    - name: unifi-dns.rules
      rules:
        - alert: UnifiDNSStale
          expr: |
            time() - external_dns_controller_last_sync_timestamp_seconds{job="unifi-dns"} > 60
          for: 5m
          annotations:
            summary: >-
              ExternalDNS controller ({{ $labels.job }}) has had no successful
              sync for over 6 minutes (over 1 minute, sustained for 5)
          labels:
            severity: critical
