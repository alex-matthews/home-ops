---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
  interval: 1h
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      repo: github://alex-matthews/home-ops
      statusChecks: true
      statusCheckName: Konflate
      prComments: true
      publicUrl: "https://{{ .Release.Name }}.${SECRET_DOMAIN}"
      mcp: true
      verifyImages: true
    secret:
      existingSecret: konflate-webhook-token-secret
    httpRoute:
      enabled: true
      # The gatus sidecar probes the route's first Exact/PathPrefix match,
      # which is the /mcp deny rule below — pin the probe to the site root.
      annotations:
        gatus.home-operations.com/endpoint: |-
          url: https://{{ .Release.Name }}.${SECRET_DOMAIN}/
          conditions: ["[STATUS] == 200"]
      parentRefs:
        - name: envoy-external
          namespace: network
      hostnames:
        - "{{ .Release.Name }}.${SECRET_DOMAIN}"
      # The MCP endpoint's only consumer is in-cluster (ADR-0004); answer it
      # with 404 externally instead of forwarding to the backend. Prepended
      # before the default catch-all rule, and /mcp is the longer path prefix,
      # so it takes precedence for GET, POST, and DELETE alike.
      additionalRules:
        - filters:
            - type: ExtensionRef
              extensionRef:
                group: gateway.envoyproxy.io
                kind: HTTPRouteFilter
                name: konflate-mcp-not-found
          matches:
            - path:
                type: PathPrefix
                value: /mcp
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
      limits:
        memory: 2Gi
