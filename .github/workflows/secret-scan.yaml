---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Secret Scan

# The git hooks prevent; this only detects. A pull request's commits are
# already public when it runs, so a finding means rotating the secret.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          minimum_release_age: 3d
          cache: false
          install_args: gitleaks yq

      - name: Scan the pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/secret-check.sh range "$BASE_SHA..$HEAD_SHA"
