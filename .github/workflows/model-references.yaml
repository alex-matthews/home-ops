---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Model References

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - kubernetes/apps/ai/**
      - kubernetes/apps/kritika/**
      - .github/scripts/model-references.sh
      - .github/workflows/model-references.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Model References
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          minimum_release_age: 3d
          cache: false
          install_args: yq

      - name: Check model references
        run: .github/scripts/model-references.sh
