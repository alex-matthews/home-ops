---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate PR Review

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Renovate PR number to review
        required: true
        type: number
  pull_request:
    branches:
      - main
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - kubernetes/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_REVIEW: ${{ github.event_name == 'workflow_dispatch' }}
  PR: ${{ github.event.pull_request.number || inputs.pr }}

permissions: {}

jobs:
  renovate-review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'bot-ler[bot]' &&
        !github.event.pull_request.draft
      )
    name: Renovate PR Review
    # Read-only token for the model; a bot token is minted afterwards for posting.
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Preflight
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip() {
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$1"
            exit 0
          }

          # A manual run can name any pull request; only the bot's own are reviewed.
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}")"
          if [ "$(jq -r '.user.login' <<< "${pr}")" != "bot-ler[bot]" ] ||
            [ "$(jq -r '.head.repo.full_name' <<< "${pr}")" != "${GITHUB_REPOSITORY}" ]; then
            skip "Skipping; PR #${PR} is not a bot-ler pull request from this repository."
          fi

          # Read the policy at this workflow's revision, not from the pull request checkout.
          prompt="${RUNNER_TEMP}/renovate-review-prompt.md"
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${GITHUB_REPOSITORY}/contents/.github/renovate-review-prompt.md?ref=${GITHUB_SHA}" > "${prompt}"

          # Key on the policy, the title, file names and changed lines; ignore rebase context,
          # so a rebase that only moves the edit does not buy a second review.
          key="$(
            {
              cat "${prompt}"
              jq -r '.title' <<< "${pr}"
              gh pr diff "${PR}" --repo "${GITHUB_REPOSITORY}" |
                awk '/^diff --git /{print; next} /^(--- |\+\+\+ )/{next} /^[+-]/{print}'
            } | sha256sum | cut -d " " -f 1
          )"
          echo "key=${key}" >> "$GITHUB_OUTPUT"

          # A stub is not a review: only the bot's review comment carries a key worth matching.
          previous="$(
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" |
              jq -r '
                [
                  (add // [])[]
                  | select(.user.login == "bot-ler[bot]")
                  | select(.body | startswith("<!-- home-ops-renovate-research -->"))
                ]
                | last | .body // ""' |
              grep -Eo 'fingerprint:[0-9a-f]{64}' | head -n 1 | cut -d : -f 2
          )" || true
          if [ "${FORCE_REVIEW}" != "true" ] && [ "${previous}" = "${key}" ]; then
            skip "Skipping; review key ${key} was already reviewed."
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.preflight.outputs.skip == 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/pull/${{ env.PR }}/head

      - name: Fetch Konflate evidence
        id: konflate
        if: ${{ steps.preflight.outputs.skip == 'false' }}
        env:
          KONFLATE_URL: ${{ vars.KONFLATE_URL }}
        run: |
          dir=".renovate-review"
          summary="${dir}/konflate-summary.md"
          rendered="${dir}/konflate-diff.md"
          mkdir -p "${dir}"
          mv "${RUNNER_TEMP}/renovate-review-prompt.md" "${dir}/prompt.md"
          rm -f "${dir}/review.md"
          echo "Konflate summary unavailable." > "${summary}"
          echo "Konflate rendered diff unavailable." > "${rendered}"
          status="unavailable"
          trap 'echo "status=${status}" >> "$GITHUB_OUTPUT"' EXIT

          if [ -z "${KONFLATE_URL:-}" ]; then
            exit 0
          fi
          base="${KONFLATE_URL%/}/api/prs/${PR}"

          # The Markdown summary answers 503 + Retry-After while a render is in flight, so --retry waits it out.
          if ! curl -fsS --max-time 30 --retry 10 --retry-delay 6 -H "Accept: text/markdown" -o "${summary}" "${base}/summary"; then
            echo "Konflate summary unavailable." > "${summary}"
            exit 0
          fi
          status="partial"

          diff_json="${RUNNER_TEMP}/konflate-diff.json"
          if ! curl -fsS --max-time 60 -o "${diff_json}" "${base}/diff" || [ "$(jq -r '.status // ""' "${diff_json}")" != "ready" ]; then
            exit 0
          fi

          # Flatten the per-resource rows (server-side highlighted HTML) into one plain-text unified diff per resource.
          cat > "${RUNNER_TEMP}/konflate-diff.jq" <<'JQ'
          def strip:
            gsub("<[^>]*>"; "")
            | gsub("&lt;"; "<") | gsub("&gt;"; ">") | gsub("&quot;"; "\"")
            | gsub("&#39;"; "'") | gsub("&#34;"; "\"") | gsub("&amp;"; "&");
          .diff as $d
          | "# Konflate rendered diff for PR \($d.prNumber) at \($d.headSha[0:7])",
            "Resources: \($d.summary.changed) changed, \($d.summary.added) added, \($d.summary.removed) removed. CRDs touched: \($d.impact.crds). Routine shape: \($d.routine). Resources omitted by the render cap: \($d.truncated // 0).",
            ($d.warnings[]? | "Warning [\(.level)] \(.rule) on \(.resource): \(.detail)"),
            ($d.failures[]? | "Render failure \(.parent): \(.message)"),
            "",
            ($d.resources[]
              | "## \(.status) \(.kind) \(.name) (+\(.add) -\(.del); rendered by \(.parent))",
                "```diff",
                (.unified[]
                  | select(.folded != true)
                  | if .hunk then "@@ \(.count // 0) unchanged lines folded @@"
                    else (if .kind == "add" then "+" elif .kind == "del" then "-" else " " end) + ((.html // "") | strip)
                    end),
                "```",
                "")
          JQ
          if ! jq -r -f "${RUNNER_TEMP}/konflate-diff.jq" "${diff_json}" > "${rendered}.full"; then
            rm -f "${rendered}.full"
            exit 0
          fi

          # Bound what the model is handed; a sweeping render can run to megabytes.
          cap=400000
          head -c "${cap}" "${rendered}.full" > "${rendered}"
          if [ "$(wc -c < "${rendered}.full")" -gt "${cap}" ]; then
            printf '\n\n[truncated at %s bytes]\n' "${cap}" >> "${rendered}"
          fi
          rm -f "${rendered}.full"
          status="ok"

      - name: Review
        if: ${{ steps.preflight.outputs.skip == 'false' }}
        # The post step reports a failed review, so the job has to reach it.
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.236
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Supplying a token bypasses the action's default-branch workflow check.
          github_token: ${{ github.token }}
          allowed_bots: "bot-ler[bot]"
          claude_args: |
            --model ${{ vars.CLAUDE_RENOVATE_REVIEW_MODEL || 'claude-sonnet-5-5' }}
            --allowedTools "Read,Glob,Grep,Edit(/${{ github.workspace }}/.renovate-review/review.md),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(gh release view:*),Bash(gh release list:*),WebFetch,WebSearch"
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ env.PR }}
            Konflate evidence: ${{ steps.konflate.outputs.status }} (ok: summary and
            rendered diff present; partial: summary only; unavailable: neither)

            Your instructions are in `.renovate-review/prompt.md`. Read that file
            now and follow it.

      - name: Generate token
        id: app-token
        if: ${{ !cancelled() && steps.preflight.outputs.skip == 'false' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Post review
        if: ${{ !cancelled() && steps.preflight.outputs.skip == 'false' }}
        # pipefail: a failed comment listing must stop the step, not read as "no comment yet".
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          KEY: ${{ steps.preflight.outputs.key }}
          KONFLATE_STATUS: ${{ steps.konflate.outputs.status || 'unavailable' }}
          KONFLATE_URL: ${{ vars.KONFLATE_URL }}
        run: |
          marker="<!-- home-ops-renovate-research -->"
          stub_marker="<!-- home-ops-renovate-research-unavailable -->"
          review=".renovate-review/review.md"
          comment="${RUNNER_TEMP}/renovate-review-comment.md"
          shape='^recommendation:(safe|human-review|changes-recommended) confidence:(high|medium|low) scope:(image|chart|chart-crds|talos|kubernetes|other) unknowns:[0-9]+$'

          verdict=""
          if [ -f "${review}" ] && [ ! -L "${review}" ] && [ "$(wc -c < "${review}")" -le 64000 ]; then
            verdict="$(head -n 1 "${review}" | tr -d '\r')"
          fi

          if [[ "${verdict}" =~ ${shape} ]]; then
            failed=false
            {
              echo "${marker}"
              echo "<!-- home-ops-renovate-research fingerprint:${KEY} ${verdict/ scope:/ konflate:${KONFLATE_STATUS} scope:} gate:false -->"
              # Avoid upstream backlinks and keep the Konflate hostname out of a public repository.
              tail -n +2 "${review}" |
                KONFLATE_HOST="$(sed -E 's#^[a-z]+://##; s#[/:].*$##' <<< "${KONFLATE_URL:-}")" perl -pe '
                  s{(?<![\w.-])https?://(?:www\.)?github\.com(?=/)}{https://redirect.github.com}gi;
                  s/\Q$ENV{KONFLATE_HOST}\E/Konflate/gi if length $ENV{KONFLATE_HOST};
                '
            } > "${comment}"
          else
            failed=true
            printf '%s\n<!-- home-ops-renovate-research fingerprint:%s recommendation:unavailable confidence:none konflate:%s scope:unknown unknowns:unknown gate:false -->\n### Renovate PR Review\n\nNo valid review was produced. Review this update manually, or retry from the manual workflow trigger with this PR number. [Run details](%s).\n' \
              "${stub_marker}" "${KEY}" "${KONFLATE_STATUS}" \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "${comment}"
          fi

          # One comment per pull request, edited in place: a review and a stub replace each other.
          existing="$(
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" |
              jq -r --arg marker "${marker}" --arg stub "${stub_marker}" '
                [
                  (add // [])[]
                  | select(.user.login == "bot-ler[bot]")
                  | select((.body | startswith($marker)) or (.body | startswith($stub)))
                ]
                | last | .id // empty'
          )"
          if [ -n "${existing}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F "body=@${comment}" > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F "body=@${comment}" > /dev/null
          fi

          [ "${failed}" = false ]
