---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Render

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - kubernetes/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Run only the tools each job installs; mise exec would otherwise install
  # every pinned tool first.
  MISE_EXEC_AUTO_INSTALL: "false"

jobs:
  render:
    name: Render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          minimum_release_age: 3d
          cache: false
          install_args: github:home-operations/flate

      - name: Render cluster
        run: mise exec -- flate test all -p ./kubernetes/flux/cluster --allow-missing-secrets
