---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Chart Verify

# Pre-merge guard for chart source verification (#1967, #2145, ADR-0003).
# Coverage is offline and intended to be required: every OCIRepository carries a verify
# block or a declared exclusion reason, and a dropped or changed verify
# block needs the verify/declared label. It runs on every pull request
# because a required check from a path-skipped workflow stays pending and
# blocks the merge. Signatures is advisory: it reads public registries and
# Sigstore, re-verifies a bumped source under its pinned identity, compares
# a bumped excluded source's declared reason with what the registry shows,
# and reports changes. Fixtures runs the offline tests when the scripts,
# keys or fixtures change.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signatures:
    name: Chart Verify - Signatures
    runs-on: ubuntu-latest
    steps:
      - name: Get changed sources
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: kubernetes/**/ocirepository.yaml

      - name: Checkout
        if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          minimum_release_age: 3d
          cache: false
          install_args: cosign oras yq

      - name: Verify changed sources at their pinned tag
        if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.changed_files }}
        run: |
          failed=0
          for file in $(jq -r '.[]' <<< "$CHANGED_FILES"); do
            [ -f "$file" ] || continue
            provider="$(mise exec -- yq -r '.spec.verify.provider // ""' "$file")"
            : > findings.md
            : > errors.md
            if [ -z "$provider" ]; then
              FINDINGS_OUT=findings.md ERRORS_OUT=errors.md \
                .github/scripts/chart-signing-check.sh "$file" > result.tsv
              if [ -s findings.md ]; then
                echo "::warning file=$file::$(sed 's/^- //' findings.md | head -1)"
              elif [ -s errors.md ]; then
                echo "::notice file=$file::signing check inconclusive: $(sed 's/^- //' errors.md | head -1)"
              else
                echo "::notice file=$file::no verify block; $(cut -f5 result.tsv | head -1)"
              fi
              continue
            fi
            if [ "$provider" != "cosign" ]; then
              echo "::warning file=$file::verify provider '$provider' is not checked here"
              continue
            fi
            url="$(mise exec -- yq -r '.spec.url' "$file" | sed 's#^oci://##')"
            tag="$(mise exec -- yq -r '.spec.ref.tag // ""' "$file")"
            if [ -z "$tag" ]; then
              echo "::warning file=$file::no spec.ref.tag; only tag pins are checked"
              continue
            fi
            count="$(mise exec -- yq -r '.spec.verify.matchOIDCIdentity | length' "$file")"
            ok=0
            for i in $(seq 0 $((count - 1))); do
              issuer="$(mise exec -- yq -r ".spec.verify.matchOIDCIdentity[$i].issuer" "$file")"
              subject="$(mise exec -- yq -r ".spec.verify.matchOIDCIdentity[$i].subject" "$file")"
              if mise exec -- cosign verify \
                  --certificate-oidc-issuer-regexp "$issuer" \
                  --certificate-identity-regexp "$subject" \
                  "$url:$tag" > /dev/null 2> cosign.err; then
                ok=1
                break
              fi
            done
            if [ "$ok" = 1 ]; then
              echo "verified $url:$tag ($file)"
            else
              echo "::error file=$file::$url:$tag does not verify under the manifest's identity: $(tail -1 cosign.err)"
              failed=1
              continue
            fi
          done
          exit "$failed"

  coverage:
    name: Chart Verify - Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          minimum_release_age: 3d
          cache: false
          install_args: yq

      - name: Check every source has a verify block or a declared reason, and guard removals
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DECLARED: ${{ contains(github.event.pull_request.labels.*.name, 'verify/declared') }}
        run: .github/scripts/chart-signing-coverage.sh "$BASE_SHA" "$HEAD_SHA" "$DECLARED"

  fixtures:
    name: Chart Verify - Fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Get changed tooling
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |
            .github/scripts/chart-signing-*.sh
            .github/keys/**
            .github/workflows/chart-*.yaml
            tests/chart-signing/**

      - name: Checkout
        if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          minimum_release_age: 3d
          cache: false
          install_args: yq

      - name: Run the offline fixtures
        if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        run: tests/chart-signing/run.sh
